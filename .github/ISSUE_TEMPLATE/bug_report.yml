name: Bug report
description: 报告可复现的行为错误
title: "[Bug]: "
body:
  - type: textarea
    id: observed
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为与规则依据
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 包含 seed、初始状态与命令序列。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 建议修改范围
    validations:
      required: false
